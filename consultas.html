<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de consultas</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
     <header>
        <div id="header">
            <h1>Clínica Médica 🩺</h1>
            <p>Cuidando de sua saúde sempre! 😉</p>
        </div>
    </header>
    <div class="geral">
        <form action="consultas.php" method="post">
    <h1>Faça o cadastro de Consultas ⬇️</h1>
    <div class="campo">
        <label for="idconsulta">ID da consulta:</label><br>
        <input type="number" placeholder="Digite aqui o ID da consulta." id="txtidconsulta" name="idconsulta">
    </div>
    <div class="campo">
        <label for="paciente">Paciente:</label><br>
        <input type="text" placeholder="Digite aqui o nome completo do paciente." id="txtpaciente" name="paciente">
    </div>
    <div class="campo">
        <label for="medico">Médico responsável:</label><br>
        <input type="text" placeholder="Digite aqui o médico responsável." id="txtmedico" name="medico">
    </div>
      <div class="campo">
        <label for="dataa">Data da Consulta:</label><br>
        <input type="text" placeholder="Digite aqui a data da consulta." id="txtsdata" name="dataa">
    </div>
    <div class="campo">
        <label for="horario">Horário:</label><br>
        <input type="text" placeholder="Digite aqui o horário." id="txthorario" name="horario">
    </div>
    <div class="campo">
        <label for="especialidade">Especialidade:</label><br>
        <input type="text" placeholder="Digite aqui a especialidade." id="txtespecialidade" name="especialidade">
    </div>
    <div class="campo">
        <label for="tipo_consulta">Tipo de Consulta:</label><br>
        <input type="text" placeholder="Digite aqui o tipo de consulta." id="txttipo_consulta" name="tipo_consulta">
    </div>
    <div class="campo">
        <label for="status_consulta">Status da Consulta:</label><br>
        <input type="text" placeholder="Digite aqui o status da consulta." id="txtstatus_consulta" name="status_consulta">
    </div>  
    <div class="campo">
        <label for="observacoes">Observações:</label><br>
        <input type="text" placeholder="Digite aqui as observações." id="txtobservacoes" name="observacoes">
    </div> 
    <input type="submit" name="submit" value="Agendar">
    <button type="reset">Limpar 🧹</button>
    </form>
    </div>
    <br>
     <div class="botaoinicio">
        </div>
    <a href="index.html">Voltar para a Página Inicial</a>
    <footer>
    Clinica Médica &copy; 2026 Todos os direitos reservados
   </footer>
</body>
</html>

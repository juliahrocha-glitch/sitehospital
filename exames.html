<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Exames</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
     <header>
        <div id="header">
            <h1>Clínica Médica 🩺</h1>
            <p>Cuidando de sua saúde sempre! 😉</p>
        </div>
    </header>
    <div class="geral">
        <form action="exames.php" method="post">
    <h1>Faça o cadastro de exame ⬇️</h1>
    <div class="campo">
        <label for="idexame">ID do Exame:</label><br>
        <input type="number" placeholder="Digite aqui o ID do exame." id="txtidexame" name="idexame">
    </div>
    <div class="campo">
        <label for="nome">Nome do exame:</label><br>
        <input type="text" placeholder="Digite aqui o nome do exame." id="txtnome" name="nome">
    </div>
    <div class="campo">
        <label for="tipo_exame">Tipo de exame:</label><br>
        <input type="text" placeholder="Digite aqui o tipo de exame." id="txttipo_exame" name="tipo_exame">
    </div>
      <div class="campo">
        <label for="dataa">Data do exame:</label><br>
        <input type="text" placeholder="Digite aqui a data do exame" id="txtdata" name="dataa">
    </div>
    <div class="campo">
        <label for="paciente">Paciente:</label><br>
        <input type="text" placeholder="Digite aqui o nome do paciente." id="txtpaciente" name="paciente">
    </div>
    <div class="campo">
        <label for="medico">Médico responsável:</label><br>
        <input type="text" placeholder="Digite aqui o médico responsável." id="txtmedico" name="medico">
    </div>
    <div class="campo">
        <label for="resultado">Resultado:</label><br>
        <input type="text" placeholder="Digite aqui o resultado do exame." id="txtresultado" name="resultado">
    </div> 
    <div class="campo">
        <label for="observacoes">Observações:</label><br>
        <input type="text" placeholder="Digite aqui as observações." id="txtobservacoes" name="observacoes">
    </div> 
    <input type="submit" name="submit" value="Agendar">
    <button type="reset">Limpar 🧹</button>
    </form>
    </div>
    <br>
     <div class="botaoinicio">
        </div>
    <a href="index.html">Voltar para a Página Inicial</a>

   </footer>
</body>
</html>
